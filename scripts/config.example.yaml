# 复制为 config.yaml 并填写你的数据源
# 支持多个网页源，每个源生成一份 RSS（type: html / next_json）

# defaults：所有 feed 共用的默认值
defaults:
  feed:
    link: "https://your-username.github.io/rsshub"
    language: "zh-CN"

# 可复用转换管道（variants 通过 transforms.use 引用）
pipelines:
  to_zh:
    - type: translate
      target: zh-CN
      fields: [title, summary]
      feed_fields: [title, description]
      on_error: keep

# 多源列表
feeds:
  - output: blog.xml
    feed:
      title: "某站博客"
      description: "从网页列表解析的 RSS"
    source:
      type: html
      url: "https://example.com/blog"
      item_selector: "article.post"
      selectors:
        title: "h2 a"
        link: "h2 a@href"
        summary: ".excerpt"
        published: "time@datetime"

