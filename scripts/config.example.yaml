# 配置模板：可复制片段合并到 scripts/config.yaml（config.yaml 随仓库提交）
# 完整配置说明：docs/CONFIG.md

defaults:
  feed:
    link: "https://your-username.github.io/rsshub"
    language: "zh-CN"

pipelines:
  to_zh:
    - type: translate
      target: zh-CN
      fields: [title, summary]   # 只译条目；频道 title/description 在 variant 里手写
      on_error: keep

feeds:
  # 单文件输出 → rss/blog.xml
  - output: blog.xml
    feed:
      title: "某站博客"
      description: "从网页列表解析的 RSS"
      link: "https://example.com/blog"
    source:
      type: html
      url: "https://example.com/blog"
      item_selector: "article.post"
      selectors:
        title: "h2 a"
        link: "h2 a@href"        # selector@attr；a|b 表示优先 a
        summary: ".excerpt"
        published: "time@datetime"
      # verify: false            # 本机 SSL 报错时取消注释

  # 一源多输出 → rss/example/feed.xml + rss/example/zh.xml
  # - dir: example
  #   output: feed.xml
  #   feed:
  #     title: "Example Blog"
  #     language: en
  #     link: "https://example.com/blog"
  #   source:
  #     type: html
  #     url: "https://example.com/blog"
  #     item_selector: "article.post"
  #     selectors:
  #       title: "h2 a"
